# configs/deploy_config.yaml
# QUIBC Edge Deployment Configuration

model:
  img_size: 256
  latent_ch: 96
  weights_path: checkpoints/best_model.weights.h5

tflite:
  # Quantization: fp32 | fp16 | int8
  quantization: int8
  output_dir: tflite_models
  calibration_batches: 50    # Number of batches for INT8 calibration

devices:
  # Simulated performance profiles (from paper)
  coral_tpu:
    fps: 26.19
    latency_ms: 38
    power_w: 2.0
    energy_per_image_j: 0.08
    recommended_quantization: int8
    notes: "Requires Edge TPU compiler (edgetpu_compiler)"

  jetson_xavier_nx:
    fps: 7.20
    latency_ms: 139
    recommended_quantization: fp16

  jetson_nano:
    fps: 3.09
    latency_ms: 323
    recommended_quantization: fp16

  raspberry_pi_4:
    fps: 0.31
    latency_ms: 3200
    recommended_quantization: fp32
    notes: "CPU-only; use for offline/low-frequency tasks"

memory_footprint_mb:
  int8: 5.38
  fp16: 10.76
  fp32: 20.52

benchmark:
  n_images: 100
  warmup_runs: 5
